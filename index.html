<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deskripsi Jabatan BRI - Regional Office Yogyakarta</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="topbar">
    <button id="menuBtn" class="hamburger-btn" aria-label="Buka menu daftar isi">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <h1 class="topbar-title">DESKRIPSI JABATAN BRI</h1>

    <div class="topbar-right-logos">
      <img src="images/white_logo_danantara.png" alt="Logo Danantara" class="topbar-logo-danantara" onerror="console.warn('Logo tidak ditemukan:', this.src); this.style.display='none'">
      <img src="images/Logo_BRI_white.png" alt="Logo BRI" class="topbar-logo-bri" onerror="console.warn('Logo tidak ditemukan:', this.src); this.style.display='none'">
    </div>
  </header>

  <!-- ============ SIDEBAR / DAFTAR ISI ============ -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <span>Daftar Isi</span>
      <button id="closeSidebarBtn" class="close-btn" aria-label="Tutup menu">&times;</button>
    </div>
    <ul id="sidebarList" class="sidebar-list">
    </ul>
  </nav>

  <!-- ================= MAIN VIEW ================= -->
  <main id="mainView">

    <!-- HERO -->
    <section class="hero">
      <div class="hero-text">
        <h2>HUMAN CAPITAL BUSINESS PARTNER</h2>
        <h2>RO YOGYAKARTA</h2>
        <p class="hero-sub">(Portal pencarian Deskripsi Jabatan (DUJ) BRI Regional Office Yogyakarta)</p>
      </div>
    </section>

    <!-- ===== SECTION 1: REGIONAL OFFICE ===== -->
    <div class="section-title-box">
      <button class="section-title-box-inner" id="toggleRO" aria-expanded="true">
        <span class="section-title-link">Materi Sosialisasi Daftar Jabatan (DUJ) BRI Regional Office Yogyakarta</span>
        <span class="toggle-arrow"></span>
      </button>
    </div>

    <div id="roBody" class="collapsible-body">
      <section id="cardsGrid" class="cards-grid"></section>
    </div>

    <!-- ===== SECTION 2: UNIT KERJA OPERASIONAL ===== -->
    <div class="section-title-box">
      <button class="section-title-box-inner" id="toggleUker" aria-expanded="true">
        <span class="section-title-link">Materi Sosialisasi Daftar Jabatan (DUJ) Unit Kerja Operasional</span>
        <span class="toggle-arrow"></span>
      </button>
    </div>

    <div id="ukerBody" class="collapsible-body">
      <section id="cardsGridUker" class="cards-grid"></section>
    </div>

    <!-- ===== SECTION 3: KPI ===== -->
   <div class="section-title-box" id="kpiSection">
  <button class="section-title-box-inner" id="toggleKPI" aria-expanded="true">
    <span class="section-title-link">KPI_Regional_Office_Area KC, KCP dan BRI Unit</span>
    <span class="toggle-arrow"></span>
  </button>
</div>

<div id="kpiBody" class="collapsible-body">
  <section class="pdf-preview-wrap">
    <div id="kpiFrameMain" class="kpi-frame"></div>
  </section>
</div>

  </main>

  <!-- ================= DETAIL VIEW ================= -->
  <section id="detailView" class="detail-view">
    <div class="detail-topbar">
      <h3 id="detailTitle">Judul Jabatan</h3>
    </div>
    <div class="detail-pdf-wrap">
      <iframe id="detailFrame" src="" title="Detail Jabatan" allow="autoplay" allowfullscreen></iframe>
      <div id="detailKpiWrap" class="detail-kpi-wrap" style="display:none;">
        <div id="kpiFrameDetail" class="kpi-frame"></div>
      </div>
      <div class="detail-actions">
        <button id="backBtn" class="back-btn">
          <span class="back-arrow">&#8592;</span> Back
        </button>
        <a id="downloadBtn" class="back-btn download-btn-detail" href="#" download style="display:none;">
          <span class="back-arrow">&#8595;</span> Download
        </a>
      </div>
    </div>
  </section>

  <script src="divisions_data.js"></script>
  <script src="script.js"></script>
</body>
</html>
